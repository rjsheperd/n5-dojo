<style>
/* Layout: built for an iPad on its side. Home = three big game cards. Each game is a two-pane table:
   a narrow prompt column on the left and the "work surface" (writing square, sorting bins, card grid)
   filling the rest. Portrait and phone stack the panes. Same paper/ink/hanko family as the other N5 apps. */
:root {
  --paper: #f3f4f0; --sheet: #ffffff; --ink: #1d2220; --muted: #5d6762; --faint: #c9cfcb;
  --guide: #9cc3ad; --guide-soft: #e3efe7; --hanko: #c43d2b; --hanko-soft: #fbe9e6;
  --ok: #2f7d55; --ok-soft: #e1f2e8; --bad: #b8432f; --bad-soft: #f8e6e2; --gold: #b9842a;
  --kanji: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141816; --sheet: #1c211f; --ink: #e9ece9; --muted: #9aa49f; --faint: #3a423e;
    --guide: #3f6a54; --guide-soft: #1e2b24; --hanko: #e2614c; --hanko-soft: #3a211d;
    --ok: #6cc596; --ok-soft: #1b3326; --bad: #ec8a76; --bad-soft: #3a221d; --gold: #ddb062; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141816; --sheet: #1c211f; --ink: #e9ece9; --muted: #9aa49f; --faint: #3a423e;
  --guide: #3f6a54; --guide-soft: #1e2b24; --hanko: #e2614c; --hanko-soft: #3a211d;
  --ok: #6cc596; --ok-soft: #1b3326; --bad: #ec8a76; --bad-soft: #3a221d; --gold: #ddb062; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--ui); font-size: 17px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--guide); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
.noselect { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--faint); }
.bar-in { max-width: 1180px; margin: 0 auto; padding-block: 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--kanji); font-weight: 600; font-size: 1.35rem; margin-right: auto; display: flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand small { font-family: var(--ui); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.pill { font-size: .85rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn { border: 1px solid var(--faint); background: var(--sheet); border-radius: 14px; padding: 12px 18px; font-weight: 700; cursor: pointer; min-height: 48px; }
.btn.ink { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.red { background: var(--hanko); color: #fff; border-color: var(--hanko); }
.btn.ok { border-color: var(--ok); color: var(--ok); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .35; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--faint); background: var(--sheet); border-radius: 999px; padding: 8px 14px; font-size: .9rem; cursor: pointer; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.lab { font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* home */
.hero { padding-block: 28px 8px; max-width: 60ch; }
.hero h1 { font-family: var(--kanji); font-weight: 600; font-size: clamp(2rem, 4.4vw, 3rem); line-height: 1.12; }
.hero p { color: var(--muted); margin: 8px 0 0; }
.gamecards { margin-top: 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.gcard { text-align: left; background: var(--sheet); border: 1px solid var(--faint); border-radius: 20px; padding: 0; cursor: pointer; display: grid; grid-template-rows: auto 1fr; overflow: hidden; transition: transform .15s ease, border-color .15s ease; }
.gcard:hover { transform: translateY(-3px); border-color: var(--guide); }
.gcard .art { position: relative; aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; background: var(--guide-soft); border-bottom: 1px solid var(--faint); }
.gcard .art .sq { position: relative; width: 52%; aspect-ratio: 1; background: var(--sheet); border: 2px solid var(--guide); border-radius: 6px; display: grid; place-items: center; font-family: var(--kanji); font-weight: 600; font-size: clamp(3rem, 8vw, 6rem); line-height: 1; }
.gcard .art .sq::before { content: ""; position: absolute; left: 50%; top: 6%; bottom: 6%; border-left: 2px dashed var(--guide-soft); }
.gcard .art .sq::after { content: ""; position: absolute; top: 50%; left: 6%; right: 6%; border-top: 2px dashed var(--guide-soft); }
.gcard .art .tool { position: absolute; right: 12px; bottom: 10px; font-size: .78rem; font-weight: 700; color: var(--muted); background: var(--sheet); border-radius: 999px; padding: 2px 10px; border: 1px solid var(--faint); }
.gcard .txt { padding: 16px 18px 18px; display: grid; gap: 6px; align-content: start; }
.gcard b { font-size: 1.15rem; }
.gcard .txt span { color: var(--muted); font-size: .92rem; }
.gcard .best { color: var(--gold); font-weight: 700; font-size: .85rem; }
.tip { margin-top: 22px; font-size: .88rem; color: var(--muted); max-width: 70ch; }

/* game table: prompt column + work surface */
.table { padding-block: 18px; display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); gap: 22px; align-items: start; }
.side { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); }
.panel { background: var(--sheet); border: 1px solid var(--faint); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
.progress { height: 8px; border-radius: 999px; background: var(--guide-soft); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--guide); transition: width .3s ease; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.spread { justify-content: space-between; }
.count { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; }

/* writing */
.prompt-m { font-size: 1.6rem; font-weight: 700; line-height: 1.25; }
.readings { display: flex; flex-wrap: wrap; gap: 6px; }
.readings span { font-family: var(--kanji); font-size: 1.2rem; background: var(--guide-soft); border-radius: 8px; padding: 2px 10px; }
.surface { display: grid; justify-items: center; gap: 14px; }
.pad { position: relative; width: min(100%, 70vh, 620px); aspect-ratio: 1; max-width: 100%; background: var(--sheet); border: 3px solid var(--guide); border-radius: 8px; touch-action: none; }
.pad::before { content: ""; position: absolute; left: 50%; top: 4%; bottom: 4%; border-left: 2px dashed var(--guide-soft); pointer-events: none; }
.pad::after { content: ""; position: absolute; top: 50%; left: 4%; right: 4%; border-top: 2px dashed var(--guide-soft); pointer-events: none; }
.pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
.pad .ghost { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.pad .stampmark { position: absolute; right: 10px; top: 10px; z-index: 2; font-weight: 800; border-radius: 10px; padding: 4px 12px; font-size: 1.05rem; }
.pad .stampmark.ok { background: var(--ok-soft); color: var(--ok); }
.pad .stampmark.mid { background: var(--guide-soft); color: var(--ink); }
.pad .stampmark.no { background: var(--bad-soft); color: var(--bad); }
.tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.verdict { font-weight: 700; text-align: center; min-height: 1.5em; }

/* sorting */
.tray { min-height: 140px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; padding: 14px; background: var(--sheet); border: 1px dashed var(--faint); border-radius: 18px; }
.tile { touch-action: none; display: inline-grid; justify-items: center; gap: 0; border: 1px solid var(--faint); background: var(--paper); border-radius: 14px; padding: 10px 16px; cursor: grab; min-height: 64px; min-width: 88px; }
.tile .w { font-family: var(--kanji); font-weight: 600; font-size: 1.45rem; line-height: 1.2; }
.tile .e { font-size: .78rem; color: var(--muted); line-height: 1.2; }
.tile .pic { font-size: 1.8rem; line-height: 1.1; }
.tile.sel { outline: 3px solid var(--ink); }
.tile.shake { animation: shake .35s; border-color: var(--bad); background: var(--bad-soft); }
.drag { position: fixed; z-index: 80; pointer-events: none; transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 12px 30px color-mix(in srgb, var(--ink) 25%, transparent); }
.bins { display: grid; gap: 12px; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); margin-top: 14px; }
.bin { min-height: 200px; border: 2px solid var(--guide); background: var(--sheet); border-radius: 18px; padding: 14px; display: grid; grid-template-rows: auto 1fr; gap: 10px; cursor: pointer; text-align: left; transition: background .15s ease, border-color .15s ease; }
.bin .head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.bin .k { font-family: var(--kanji); font-weight: 600; font-size: 2.6rem; line-height: 1; }
.bin .t { font-weight: 700; }
.bin .rule { font-size: .82rem; color: var(--muted); line-height: 1.3; }
.bin .got { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.bin .got span { font-family: var(--kanji); font-size: .95rem; background: var(--ok-soft); border-radius: 8px; padding: 1px 8px; }
.bin.over { background: var(--guide-soft); border-color: var(--ink); }
.bin.flash-ok { background: var(--ok-soft); border-color: var(--ok); }
.bin.flash-no { background: var(--bad-soft); border-color: var(--bad); }
.why { min-height: 3.2em; font-size: .95rem; }
.why b { font-family: var(--kanji); }

/* memory */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.mcard { container-type: inline-size; position: relative; aspect-ratio: 3 / 4; max-width: 100%; perspective: 900px; border: 0; padding: 0; background: none; cursor: pointer; }
.mcard .in { position: absolute; inset: 0; transition: transform .35s ease; transform-style: preserve-3d; }
.mcard.up .in, .mcard.done .in { transform: rotateY(180deg); }
.mcard .f, .mcard .b { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; padding: 8px; text-align: center; }
.mcard .b { background: var(--sheet); border: 2px solid var(--guide); }
.mcard .b::before { content: "?"; font-family: var(--kanji); font-size: 2rem; color: var(--guide); }
.mcard .f { transform: rotateY(180deg); background: var(--sheet); border: 2px solid var(--ink); font-weight: 700; font-size: 1rem; line-height: 1.25; overflow-wrap: anywhere; }
/* Japanese faces stay on one line and shrink to fit the card's width */
.mcard .f.jp { font-family: var(--kanji); font-weight: 600; white-space: nowrap; font-size: min(2.4rem, calc(84cqi / var(--len, 2))); }
.mcard.done .f { border-color: var(--ok); background: var(--ok-soft); }
.mcard.miss .f { border-color: var(--bad); background: var(--bad-soft); }

/* summary */
.summary { margin: 30px auto; max-width: 640px; background: var(--sheet); border: 1px solid var(--faint); border-radius: 20px; padding: 26px; display: grid; gap: 16px; justify-items: center; text-align: center; }
.summary h2 { font-family: var(--kanji); font-weight: 600; font-size: 2.2rem; }
.stats3 { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stats3 div { background: var(--paper); border-radius: 12px; padding: 12px 6px; }
.stats3 b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.stats3 span { font-size: .78rem; color: var(--muted); }
.results { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.results span { font-family: var(--kanji); font-size: 1.5rem; padding: 4px 12px; border-radius: 10px; border: 1px solid var(--faint); display: grid; justify-items: center; line-height: 1.2; }
.results span small { font-family: var(--ui); font-size: .72rem; color: var(--muted); }
.results span.no { border-color: var(--bad); background: var(--bad-soft); }

.fx { position: fixed; inset: 0; pointer-events: none; z-index: 90; display: grid; place-items: center; }
.hanamaru { width: min(50vw, 260px); }
.hanamaru path { fill: none; stroke: var(--hanko); stroke-width: 5; stroke-linecap: round; }
@media (prefers-reduced-motion: no-preference) {
  .hanamaru path { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1s ease forwards; }
  .fx { animation: fadeout .5s ease .9s forwards; }
}
@media (prefers-reduced-motion: reduce) { .mcard .in { transition: none; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }


/* harder games */
.section-h { margin-top: 30px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-h h2 { font-size: 1.25rem; }
.section-h span { color: var(--muted); font-size: .9rem; }
.gamecards.two { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 12px; }
.gcard.hard .art { background: var(--hanko-soft); }
.gcard.hard .art .sq { border-color: var(--hanko); }
.gcard .art .tag { position: absolute; left: 12px; top: 10px; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; color: #fff; background: var(--hanko); border-radius: 999px; padding: 2px 10px; }
.bigread { font-family: var(--kanji); font-weight: 600; font-size: clamp(1.8rem, 3.4vw, 2.6rem); line-height: 1.2; overflow-wrap: anywhere; }
.slots { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; align-items: center; }
.slot { position: relative; width: clamp(76px, 10vw, 120px); aspect-ratio: 1; max-width: 100%; border: 3px dashed var(--guide); border-radius: 8px; background: var(--sheet); display: grid; place-items: center; font-family: var(--kanji); font-weight: 600; font-size: clamp(2.6rem, 6vw, 4.4rem); line-height: 1; cursor: pointer; }
.slot.filled { border-style: solid; }
.slot.ok { border-color: var(--ok); background: var(--ok-soft); }
.slot.no { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.slot .rt { position: absolute; top: -1.6em; left: 0; right: 0; text-align: center; font-size: .9rem; font-family: var(--kanji); color: var(--muted); white-space: nowrap; }
.slots.reveal { margin-top: 1.6em; }
.fixed { font-family: var(--kanji); font-weight: 600; font-size: clamp(1.8rem, 4vw, 3rem); color: var(--muted); }
.ktiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
.ktile { aspect-ratio: 1; max-width: 100%; border: 1px solid var(--faint); background: var(--sheet); border-radius: 14px; font-family: var(--kanji); font-weight: 600; font-size: clamp(2rem, 4vw, 2.8rem); line-height: 1; cursor: pointer; display: grid; place-items: center; }
.ktile:disabled { opacity: .2; cursor: default; }
.breakdown { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.bpart { border: 1px solid var(--faint); background: var(--sheet); border-radius: 14px; padding: 10px 14px; display: grid; justify-items: center; gap: 2px; min-width: 92px; }
.bpart .k { font-family: var(--kanji); font-weight: 600; font-size: 2.2rem; line-height: 1.1; }
.bpart .r { font-family: var(--kanji); font-size: 1.25rem; font-weight: 600; }
.bpart .r.chg { color: var(--hanko); }
.bpart small { font-size: .74rem; color: var(--muted); text-align: center; line-height: 1.3; }
.note { font-size: .92rem; color: var(--muted); text-align: center; max-width: 60ch; }
.rchips { display: flex; flex-wrap: wrap; gap: 10px; min-height: 64px; align-items: center; }
.rchip { touch-action: none; font-family: var(--kanji); font-weight: 600; font-size: 1.5rem; padding: 10px 20px; border-radius: 999px; border: 2px solid var(--ink); background: var(--sheet); cursor: grab; min-height: 56px; }
.rchip.sel { background: var(--ink); color: var(--paper); }
.swords { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.sword { text-align: left; border: 2px solid var(--guide); background: var(--sheet); border-radius: 18px; padding: 16px 18px; display: grid; gap: 6px; cursor: pointer; min-height: 150px; align-content: start; }
.sword .w { font-family: var(--kanji); font-weight: 600; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.15; }
.sword .w b { color: var(--hanko); }
.sword .m { color: var(--muted); font-size: .92rem; }
.sword .ans { font-family: var(--kanji); font-size: 1.3rem; font-weight: 600; min-height: 1.6em; border-bottom: 2px dashed var(--faint); padding-bottom: 2px; }
.sword .ans.set { border-bottom-color: var(--ink); }
.sword .full { font-family: var(--kanji); font-size: 1.05rem; }
.sword .full b { color: var(--hanko); }
.sword.over { background: var(--guide-soft); border-color: var(--ink); }
.sword.ok { border-color: var(--ok); background: var(--ok-soft); }
.sword.no { border-color: var(--bad); background: var(--bad-soft); }
@media (max-width: 560px) { .swords { grid-template-columns: 1fr; } .gamecards.two { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .table { grid-template-columns: 1fr; }
  .side { position: static; }
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 760px) { .gamecards { grid-template-columns: 1fr; } .gcard { grid-template-columns: 38% minmax(0, 1fr); grid-template-rows: none; } .gcard .art { aspect-ratio: auto; min-height: 150px; border-bottom: 0; border-right: 1px solid var(--faint); } }
@media (max-width: 560px) {
  body { font-size: 16px; }
  .bins { grid-template-columns: 1fr; }
  .bin { min-height: 0; }
  .grid { gap: 8px; }
  .mcard .f { padding: 4px; font-size: .82rem; }

  .brand small { display: none; }
}
</style>

const RU_TRAP = /[いきしちにひみりぎじびぴえけせてねへめれげぜでべぺ]る$/;
const DECKS = {
  counters: { name: "Objects → counters", desc: "Three or four counters a round, with the objects they count." },
  verbs: { name: "Verb groups", desc: "う-verbs, る-verbs and the irregulars. Watch for う-verbs that end in -iru/-eru, like かえる." },

  if (s === "くる") return "こない";

function buildSortRound(deck) {

    const items = shuffle(OBJECTS.filter(o => ks.includes(o[3]))).slice(0, 12).map(o => ({ id: o[1] + o[3], pic: o[0], w: o[1], e: o[2], bin: o[3] }));
    return { bins: ks.map(k => ({ id: k, k, t: COUNTERS[k].r, rule: COUNTERS[k].rule })), items };
  }
  if (deck === "verbs") {
    const V = WORDS.filter(w => w.cat === "Verbs" && !w.g.includes("/") && w.t === "Verb");
    const traps = shuffle(V.filter(w => w.g.startsWith("う") && RU_TRAP.test(w.say))).slice(0, 3);
    const ru = shuffle(V.filter(w => w.g.startsWith("る"))).slice(0, 4);
    const irr = shuffle(V.filter(w => w.g.startsWith("Irr"))).slice(0, 2);
    const u = shuffle(V.filter(w => w.g.startsWith("う") && !traps.includes(w))).slice(0, 12 - traps.length - ru.length - irr.length);
    const items = shuffle([...traps, ...ru, ...irr, ...u]).map(x => ({ id: x.w, w: x.w, e: x.m.split(";")[0], bin: x.g.startsWith("う") ? "u" : x.g.startsWith("る") ? "ru" : "irr", x }));
    return { bins: [{ id: "u", k: "う", t: "う-verbs · Group 1", rule: "ない form: change the last sound to the あ row (かく → かかない)" }, { id: "ru", k: "る", t: "る-verbs · Group 2", rule: "ない form: drop る (たべる → たべない)" }, { id: "irr", k: "!", t: "Irregular · Group 3", rule: "する, くる and every ～する verb" }], items };
  }

  const traps = shuffle(A.filter(w => w.t === "な-adjective" && w.say.endsWith("い"))).slice(0, 3);
  const na = shuffle(A.filter(w => w.t === "な-adjective" && !traps.includes(w))).slice(0, 3);

}
function explain(deck, it, wrongBin) {

  return `<div class="breakdown">${e.parts.filter(p => p.k).map(p => {
    const k = p.k === "々" ? null : BYK[p.k];
    const how = p.change ? `${esc(p.plain)} → ${esc(p.r)}<br>${esc(p.change)}` : `${p.kind === "on" ? "on reading" : "kun reading"}`;
    return `<div class="bpart"><span class="k">${esc(p.k)}</span><span class="r ${p.change ? "chg" : ""}">${esc(p.r)}</span><small>${p.k === "々" ? "repeat mark: the kanji again" : how}</small>${k ? `<small>${esc(k.m1)}</small>` : ""}</div>`;

  for (const e of COMP) for (const p of (e.parts || [])) {
    if (!p.k || p.k === "々") continue;
    (map[p.k] = map[p.k] || {})[p.r] = (map[p.k][p.r] || []).concat([e]);
  }
  return Object.entries(map).filter(([, rs]) => Object.keys(rs).length >= 3).map(([k, rs]) => ({ k, rs }));
}
const SWITCH = switchKanji();
let SW = null;
function switchSetup() {
  pill("");
  show(`<div class="table"><div class="side"><div class="panel"><h2 style="font-family:var(--kanji);font-size:1.8rem">Reading switch</h2>
      <p style="margin:0;color:var(--muted)">Each round picks one kanji and up to four words that use it. Drag each reading onto the word where the kanji is read that way, or tap a reading, then a word.</p></div></div>
    <div class="panel" style="gap:14px"><div class="lab">${SWITCH.length} kanji change their reading across your compounds</div>
      <div class="chips">${SWITCH.map(s => `<span class="chip" style="cursor:default;font-family:var(--kanji);font-size:1.2rem">${s.k}<span style="font-family:var(--ui);font-size:.75rem;color:var(--muted);margin-left:6px">${Object.keys(s.rs).length}</span></span>`).join("")}</div>
      <div class="row"><button class="btn ink" id="go" style="min-width:180px">Start: 6 kanji</button></div></div></div>`);
  $("#go").addEventListener("click", () => switchStart());
}
function switchStart() {
  SW = { list: shuffle(SWITCH).slice(0, 6), i: 0, right: 0, total: 0, missed: [] };
  show(`<div class="table noselect"><div class="side">
      <div class="panel"><div class="row spread"><span class="lab">Reading switch</span><span class="count" id="x-count"></span></div><div class="progress"><i id="x-prog"></i></div>
        <div style="display:flex;gap:14px;align-items:center"><div class="slot filled" style="cursor:default;width:96px" id="x-k"></div><div><div class="prompt-m" style="font-size:1.2rem" id="x-m"></div><div class="lab" style="text-transform:none;letter-spacing:0;font-weight:500" id="x-snd"></div></div></div></div>
      <div class="panel"><div class="lab">Readings</div><div class="rchips" id="chips"></div>
        <div class="row"><button class="btn ink" id="x-check" style="flex:1" disabled>Check</button></div></div>
      <button class="btn" id="x-quit">End round</button></div>
    <div style="display:grid;gap:14px"><div class="swords" id="swords"></div><div id="x-fb" style="display:grid;justify-items:center;gap:10px"></div></div></div>`);
  $("#x-check").addEventListener("click", switchCheck);
  $("#x-quit").addEventListener("click", switchEnd);
  switchShow();
}
function switchShow() {
  const s = SW.list[SW.i];
  if (!s) return switchEnd();
  const rs = shuffle(Object.keys(s.rs)).slice(0, 4);
  const words = rs.map(r => { const e = shuffle(s.rs[r])[0]; return { e, r, part: e.parts.find(p => p.k === s.k && p.r === r) }; });
  const k = BYK[s.k];
  const decoy = shuffle((k.snd || []).filter(x => !Object.keys(s.rs).includes(x) && x.length > 0))[0];
  SW.cur = { s, words: shuffle(words), chips: shuffle([...rs, ...(decoy ? [decoy] : [])]).map((r, i) => ({ r, i, at: null })), sel: null, checked: false };
  $("#x-k").textContent = s.k; $("#x-m").textContent = k.m;
  $("#x-snd").textContent = "Dictionary readings: " + k.rd.join("・");
  $("#x-count").textContent = `${SW.i + 1} / ${SW.list.length}`;
  $("#x-prog").style.width = (SW.i / SW.list.length * 100) + "%";
  $("#x-fb").innerHTML = "";
  pill(`${SW.right}/${SW.total} words`);
  switchRender();
}
function markKanji(w, k) { return toks(w).map(c => c === k ? `<b>${c}</b>` : esc(c)).join(""); }
function markReading(e, k) { return e.parts.map(p => p.k === k ? `<b>${esc(p.r)}</b>` : esc(p.r || p.kana || "")).join(""); }
function switchRender() {
  const c = SW.cur;
  $("#chips").innerHTML = c.chips.filter(ch => ch.at === null).map(ch => `<button class="rchip ${c.sel === ch.i ? "sel" : ""}" data-c="${ch.i}">${esc(ch.r)}</button>`).join("") || `<span style="color:var(--muted)">All placed</span>`;
  $("#swords").innerHTML = c.words.map((w, j) => {
    const ch = c.chips.find(x => x.at === j);
    const res = c.checked ? (ch && ch.r === w.r ? "ok" : "no") : "";
    return `<button class="sword ${res}" data-j="${j}"><span class="w">${markKanji(w.e.w, c.s.k)}</span><span class="m">${esc(w.e.m)}</span>
      <span class="ans ${ch ? "set" : ""}">${ch ? esc(ch.r) : "&nbsp;"}</span>
      ${c.checked ? `<span class="full">${markReading(w.e, c.s.k)}${w.part.change ? ` <span style="color:var(--muted);font-family:var(--ui);font-size:.8rem">(${esc(w.part.plain)} → ${esc(w.part.r)}, ${esc(w.part.change)})</span>` : ""}</span>` : ""}</button>`;
  }).join("");
  $("#x-check").disabled = c.checked || c.words.some((w, j) => !c.chips.some(x => x.at === j));
  document.querySelectorAll(".rchip").forEach(chipDrag);
  document.querySelectorAll(".sword").forEach(b => b.addEventListener("click", () => {
    if (c.checked) return;
    const j = +b.dataset.j, there = c.chips.find(x => x.at === j);
    if (c.sel !== null) { placeChip(c.sel, j); return; }
    if (there) { there.at = null; switchRender(); }        // tap a filled word to take its reading back
  }));
}
function placeChip(i, j) {
  const c = SW.cur, ch = c.chips.find(x => x.i === i); if (!ch) return;
  const there = c.chips.find(x => x.at === j); if (there) there.at = null;
  ch.at = j; c.sel = null; sfx.flip(); switchRender();
}
function chipDrag(el) {
  const i = +el.dataset.c; let ghostEl = null, sx = 0, sy = 0, moved = false, over = null, pid = null;
  el.addEventListener("pointerdown", e => { if (pid !== null || SW.cur.checked) return; pid = e.pointerId; try { el.setPointerCapture(e.pointerId); } catch (err) {} sx = e.clientX; sy = e.clientY; moved = false; });
  el.addEventListener("pointermove", e => {
    if (e.pointerId !== pid) return;
    if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) { moved = true; ghostEl = el.cloneNode(true); ghostEl.classList.add("drag"); document.body.appendChild(ghostEl); el.style.opacity = ".3"; }
    if (!moved) return;
    ghostEl.style.left = e.clientX + "px"; ghostEl.style.top = e.clientY + "px";
    const t = document.elementFromPoint(e.clientX, e.clientY), w = t && t.closest(".sword");
    if (over && over !== w) over.classList.remove("over"); over = w; if (w) w.classList.add("over");
  });
  const end = e => {
    if (e.pointerId !== pid) return; pid = null;
    if (ghostEl) { ghostEl.remove(); ghostEl = null; } el.style.opacity = "";
    if (over) over.classList.remove("over");
    if (moved && over) placeChip(i, +over.dataset.j);
    else if (!moved) { SW.cur.sel = SW.cur.sel === i ? null : i; switchRender(); }
    over = null;
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}
function switchCheck() {
  const c = SW.cur; c.checked = true;
  let n = 0;
  c.words.forEach((w, j) => { const ch = c.chips.find(x => x.at === j); if (ch && ch.r === w.r) n++; else SW.missed.push({ w: w.e.w, r: w.e.r, k: c.s.k }); });
  SW.right += n; SW.total += c.words.length;
  n === c.words.length ? (sfx.ok(), hanamaru()) : sfx.no();
  switchRender();
  $("#x-fb").innerHTML = `<div class="verdict" style="color:var(${n === c.words.length ? "--ok" : "--bad"})">${n === c.words.length ? "全部正解!" : `${n} of ${c.words.length} right`}</div>
    <button class="btn ink" id="x-next" style="min-width:160px">${SW.i + 1 < SW.list.length ? "Next kanji" : "See results"}</button>`;
  $("#x-next").addEventListener("click", () => { SW.i++; switchShow(); }); $("#x-next").focus();
  pill(`${SW.right}/${SW.total} words`);
}
function switchEnd() {
  const pct = SW.total ? Math.round(100 * SW.right / SW.total) : 0, full = SW.i >= SW.list.length;
  const isBest = full && setBest("switch", pct, false);
  sfx.done(); pill("");
  show(`<div class="summary"><h2>${full && pct === 100 ? "満点!" : "お疲れさま"}</h2>
    <div class="stats3"><div><b>${SW.right}/${SW.total}</b><span>readings right</span></div><div><b>${pct}%</b><span>${isBest ? "new best" : "accuracy"}</span></div><div><b>${Math.min(SW.i + 1, SW.list.length)}</b><span>kanji</span></div></div>
    ${SW.missed.length ? `<div class="results">${SW.missed.map(m => `<span class="no">${markKanji(m.w, m.k)}<small>${esc(m.r)}</small></span>`).join("")}</div>` : ""}
    <div class="row" style="justify-content:center"><button class="btn ink" id="again">Another 6 kanji</button><button class="btn" id="home2">All games</button></div></div>`);
  $("#again").addEventListener("click", switchStart); $("#home2").addEventListener("click", home);
}

home();
</script>
