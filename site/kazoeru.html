<style>
/* Layout: one narrow column; a practice-paper square holds the prompt, four answer tiles below.
   Same family as N5 Kanji Renshū: sumi ink, practice-paper green guides, hanko red. */
:root {
  --paper: #f5f6f3; --sheet: #ffffff; --ink: #1d2220; --muted: #5d6762; --faint: #c9cfcb;
  --guide: #9cc3ad; --guide-soft: #e6f1ea; --hanko: #c43d2b; --hanko-soft: #fbe9e6;
  --ok: #2f7d55; --ok-soft: #e3f3ea; --bad: #b8432f; --bad-soft: #f8e6e2; --gold: #b9842a;
  --kanji: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141816; --sheet: #1c211f; --ink: #e9ece9; --muted: #9aa49f; --faint: #3a423e;
    --guide: #3f6a54; --guide-soft: #1e2b24; --hanko: #e2614c; --hanko-soft: #3a211d;
    --ok: #6cc596; --ok-soft: #1b3326; --bad: #ec8a76; --bad-soft: #3a221d; --gold: #ddb062; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141816; --sheet: #1c211f; --ink: #e9ece9; --muted: #9aa49f; --faint: #3a423e;
  --guide: #3f6a54; --guide-soft: #1e2b24; --hanko: #e2614c; --hanko-soft: #3a211d;
  --ok: #6cc596; --ok-soft: #1b3326; --bad: #ec8a76; --bad-soft: #3a221d; --gold: #ddb062; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.6; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--guide); outline-offset: 2px; }
h1, h2 { margin: 0; text-wrap: balance; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; display: grid; gap: 16px; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--kanji); font-weight: 600; font-size: 1.3rem; margin-right: auto; display: flex; gap: 8px; align-items: baseline; }
.brand small { font-family: var(--ui); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.pill { font-size: .82rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.gold { color: var(--gold); }
.seg { display: inline-flex; border: 1px solid var(--faint); border-radius: 10px; overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: .85rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.intro h1 { font-family: var(--kanji); font-weight: 600; font-size: clamp(1.6rem, 6vw, 2.1rem); line-height: 1.2; }
.intro p { margin: 6px 0 0; color: var(--muted); }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.progress { height: 8px; border-radius: 999px; background: var(--guide-soft); overflow: hidden; }
.progress .fill { height: 100%; background: var(--guide); transition: width .3s ease; }
.counter { font-size: .85rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.label { text-align: center; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.square { justify-self: center; position: relative; width: min(78vw, 320px); aspect-ratio: 1.35; background: var(--sheet); border: 2px solid var(--guide); border-radius: 6px; display: grid; place-items: center; align-content: center; gap: 2px; padding: 12px; }
.square::before { content: ""; position: absolute; left: 50%; top: 6%; bottom: 6%; border-left: 2px dashed var(--guide-soft); }
.square::after { content: ""; position: absolute; top: 50%; left: 4%; right: 4%; border-top: 2px dashed var(--guide-soft); }
.square > * { position: relative; z-index: 1; }
.big { font-family: var(--kanji); font-weight: 600; font-size: clamp(3.2rem, 17vw, 5rem); line-height: 1.05; font-variant-numeric: tabular-nums; }
.big.word { font-size: clamp(2.4rem, 12vw, 3.4rem); }
.hint { font-size: .95rem; color: var(--muted); text-align: center; }
.combo { text-align: center; font-weight: 700; color: var(--hanko); min-height: 1.5em; font-size: .9rem; }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { position: relative; min-height: 70px; border: 1px solid var(--faint); background: var(--sheet); border-radius: 12px; cursor: pointer; padding: 10px; display: grid; place-items: center; text-align: center; font-family: var(--kanji); font-weight: 600; font-size: 1.35rem; line-height: 1.2; }
.nohint .square:not(.done) .hint { visibility: hidden; }
.noread .opt:not([disabled]) small, .noread .ccard .rd { visibility: hidden; }
.rtoggle { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); cursor: pointer; background: none; border: 0; padding: 0; font-weight: 700; }
.rtoggle .sw { width: 40px; height: 24px; border-radius: 999px; background: var(--faint); position: relative; flex: none; }
.rtoggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--sheet); transition: transform .2s ease; }
.rtoggle[aria-checked="true"] .sw { background: var(--ok); }
.rtoggle[aria-checked="true"] .sw::after { transform: translateX(16px); }
.opt small { display: block; font-family: var(--ui); font-weight: 500; font-size: .75rem; color: var(--muted); }
.opt .n { position: absolute; top: 5px; left: 9px; font-family: var(--ui); font-size: .7rem; color: var(--muted); font-weight: 700; }
.opt.long { font-size: 1.05rem; white-space: nowrap; }
.opt.xlong { font-size: .92rem; white-space: nowrap; }
.row.long div { font-size: .74rem; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); animation: shake .3s; }
.opt[disabled] { cursor: default; }
.feedback { border-radius: 12px; padding: 12px 14px; background: var(--sheet); border: 1px solid var(--faint); display: grid; gap: 8px; }
.feedback .verdict { font-weight: 700; }
.feedback .verdict.ok { color: var(--ok); }
.feedback .verdict.no { color: var(--bad); }
.row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.row div { background: var(--paper); border-radius: 6px; padding: 4px 2px; text-align: center; font-family: var(--kanji); font-size: .92rem; line-height: 1.25; }
.row div b { display: block; font-family: var(--ui); font-size: .66rem; color: var(--muted); }
.row div.odd { background: var(--hanko-soft); color: var(--hanko); font-weight: 600; }
.row div.this { outline: 2px solid var(--ink); }
.note { font-size: .82rem; color: var(--muted); }
.cta { justify-self: center; border: 0; border-radius: 12px; background: var(--ink); color: var(--paper); font-weight: 700; padding: 12px 22px; cursor: pointer; font-size: 1rem; }
.ghost { border: 1px solid var(--faint); background: var(--sheet); border-radius: 12px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
.summary { background: var(--sheet); border: 1px solid var(--faint); border-radius: 16px; padding: 22px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.summary h2 { font-family: var(--kanji); font-weight: 600; font-size: 2rem; }
.stats { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats div { background: var(--paper); border-radius: 10px; padding: 10px 4px; }
.stats b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stats span { font-size: .74rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chips button { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 4px 10px; font-family: var(--kanji); font-size: 1.1rem; cursor: pointer; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.ccard { border: 1px solid var(--faint); background: var(--sheet); border-radius: 10px; padding: 8px 4px; cursor: pointer; display: grid; justify-items: center; gap: 0; }
.ccard .k { font-family: var(--kanji); font-weight: 600; font-size: 1.5rem; line-height: 1.2; }
.ccard span { font-size: .7rem; color: var(--muted); text-align: center; line-height: 1.25; }
.ccard { position: relative; }
.ccard .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--hanko); }
.newtag { display: inline-block; background: var(--hanko); color: #fff; border-radius: 999px; padding: 1px 9px; letter-spacing: .06em; margin-right: 4px; }
.ccard .acc { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 700; }
.ref { background: var(--sheet); border: 1px solid var(--faint); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.ref h2 { font-family: var(--kanji); font-weight: 600; font-size: 1.5rem; }
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; display: grid; place-items: center; }
.hanamaru { width: min(56vw, 220px); }
.hanamaru path { fill: none; stroke: var(--hanko); stroke-width: 5; stroke-linecap: round; }
@media (prefers-reduced-motion: no-preference) {
  .hanamaru path { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1s ease forwards; }
  .fx { animation: fadeout .5s ease .9s forwards; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
</style>

function wrongReadings(c, i) {

function makeRound() {

  const cards = COUNTERS.map(c => {
    const s = stats[c.c]; const acc = s && s.r + s.w ? Math.round(100 * s.r / (s.r + s.w)) + "%" : "";
    return `<button class="ccard" data-c="${esc(c.c)}">${s ? "" : `<span class="dot" title="Not practiced yet"></span>`}<span class="k">${esc(c.c)}</span><span class="rd">${esc(c.r.split(" ")[0])}</span><span class="acc">${acc}</span></button>`;
  }).join("");
  $("#app").innerHTML = `${header()}
    <section class="intro"><h1>12 quick rounds to lock in the counters.</h1>
      <p>Pick the right counter for a thing, then the right reading. The sound changes (いっぽん, さんぼん, ろっぴゃく…) are the hard part, so that's what the wrong answers test. Counters you miss come up more often.</p></section>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <div class="seg" role="group" aria-label="Question type">
        <button data-m="mix" aria-pressed="${mode === "mix"}">Mixed</button><button data-m="say" aria-pressed="${mode === "say"}">Say it</button><button data-m="which" aria-pressed="${mode === "which"}">Which counter?</button></div>
      <button class="cta" id="play">Play</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px"><div class="label" style="text-align:left">Tap a counter to see 1–10 · shaded = sound change${COUNTERS.some(c => !stats[c.c]) ? ` · <span style="color:var(--hanko)">●</span> not practiced yet (${COUNTERS.filter(c => !stats[c.c]).length})` : ""}</div><div style="display:flex;gap:20px;flex-wrap:wrap">${readToggle()}${hintToggle()}</div></div>
    <div class="cards">${cards}</div>
    <div id="ref"></div>`;
  document.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => { mode = b.dataset.m; store.set("mode", mode); home(); }));
  $("#play").addEventListener("click", start); bindReadToggle(); bindHintToggle();
  document.querySelectorAll(".ccard").forEach(b => b.addEventListener("click", () => showRef(b.dataset.c)));
}
function showRef(k) {
  const c = C[k];
  $("#ref").innerHTML = `<div class="ref"><h2>${esc(c.c)} <span style="font-size:1rem;color:var(--muted)">${esc(c.r)} · ${esc(c.used)}</span></h2>${rowHtml(c, -1)}
    <div class="note"><span style="font-family:var(--kanji);font-size:1rem;color:var(--ink)">${esc(c.ex)}</span><br>${esc(c.exEn)}</div></div>`;
  $("#ref").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function start() {
  game = { qs: makeRound(), i: 0, right: 0, combo: 0, best: 0, missed: new Set() };
  ask();
}
function ask() {
  const g = game, q = g.qs[g.i];
  if (!q) return finish();
  $("#app").innerHTML = `${header(`<button class="ghost" id="quit" style="padding:5px 12px">Quit</button>`)}
    <div class="bar"><div class="progress"><div class="fill" style="width:${g.i / g.qs.length * 100}%"></div></div><span class="counter">${g.i + 1}/${g.qs.length}</span></div>
    <div class="label">${q.fresh ? `<span class="newtag">New counter</span> ` : ""}${q.label}</div>
    <div class="square"><div class="big ${q.type === "which" ? "word" : ""}">${esc(q.big)}</div><div class="hint">${esc(q.hint)}</div></div>
    <div class="combo" id="combo" aria-live="polite">${g.combo >= 2 ? `${g.combo} in a row` : ""}</div>
    <div class="options">${q.options.map((o, i) => `<button class="opt ${o.t.length > 7 ? "xlong" : o.t.length > 5 ? "long" : ""}" data-i="${i}"><span class="n">${i + 1}</span>${esc(o.t)}${o.sub ? `<small>${esc(o.sub)}</small>` : ""}</button>`).join("")}</div>
    <div id="fb"></div>
    <div style="display:flex;justify-content:flex-start;gap:20px;flex-wrap:wrap">${readToggle()}${hintToggle()}</div>`;
  $("#quit").addEventListener("click", home); bindReadToggle(); bindHintToggle();
  document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
  document.onkeydown = e => { if (["1", "2", "3", "4"].includes(e.key) && !g.answered) answer(+e.key - 1); else if ((e.key === "Enter" || e.key === " ") && g.answered) { e.preventDefault(); next(); } };
  g.answered = false;
}
function answer(i) {
  const g = game, q = g.qs[g.i];
  if (g.answered) return; g.answered = true;
  const btns = document.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true); $(".square").classList.add("done");
  q.options.forEach((o, j) => o.ok && btns[j].classList.add("right"));
  const ok = q.options[i].ok;
  const s = stats[q.c.c] = stats[q.c.c] || { r: 0, w: 0 };
  ok ? s.r++ : s.w++; store.set("stats", stats);
  if (ok) {
    g.right++; g.combo++; g.best = Math.max(g.best, g.combo); sfx.ok();
    if (g.combo % 5 === 0) hanamaru();
  } else { btns[i].classList.add("wrong"); g.combo = 0; g.missed.add(q.c.c); sfx.no(); }
  $("#combo").textContent = g.combo >= 2 ? `${g.combo} in a row` : "";
  const right = q.options.find(o => o.ok).t;
  const verdict = q.type === "which"
    ? (ok ? `正解! ${q.object[0]} → ${right}` : `${q.object[0]} (${q.object[1]}) are counted with ${right}${q.object[2].length > 1 ? " or " + q.object[2][1] : ""}`)
    : (ok ? `正解! ${q.big} = ${right}` : `${q.big} is ${right}`);
  $("#fb").innerHTML = `<div class="feedback"><div class="verdict ${ok ? "ok" : "no"}">${esc(verdict)}</div>${rowHtml(q.c, q.type === "say" && q.i < 10 ? q.i : -1)}
    <button class="cta" id="next">${g.i + 1 < g.qs.length ? "Next" : "See results"}</button></div>`;
  $("#next").addEventListener("click", next);
  if (ok) $("#next").focus(); else $("#next").focus();
}
function next() { game.i++; ask(); }
function finish() {
  const g = game; document.onkeydown = null;
  const best = store.get("best", 0), isBest = g.right > best;
  if (isBest) store.set("best", g.right);
  sfx.done(); if (g.right === g.qs.length) setTimeout(hanamaru, 150);
  const title = g.right === g.qs.length ? "満点!" : g.right >= 9 ? "よくできました" : g.right >= 6 ? "いいですね" : "もう一度!";
  $("#app").innerHTML = `${header()}<div class="summary"><h2>${title}</h2>
    <div class="stats"><div><b>${g.right}/${g.qs.length}</b><span>correct</span></div><div><b>${g.best}</b><span>best streak</span></div><div><b>${isBest ? "New!" : best}</b><span>best score</span></div></div>
    ${g.missed.size ? `<div><div class="label" style="margin-bottom:6px">Review these</div><div class="chips">${[...g.missed].map(k => `<button data-c="${esc(k)}">${esc(k)}</button>`).join("")}</div></div><div id="ref" style="width:100%;text-align:left"></div>` : ""}
    <div style="display:flex;gap:10px"><button class="cta" id="again">Play again</button><button class="ghost" id="home">All counters</button></div></div>`;
  $("#again").addEventListener("click", start); $("#home").addEventListener("click", home);
  document.querySelectorAll(".chips button").forEach(b => b.addEventListener("click", () => showRef(b.dataset.c)));
}
home();
</script>
