<title>N5 Keiyōshi Renshū</title>
<style>
/* Layout: same family as N5 Kanji Renshū. Home = hero, today's practice, games, then a board of word
   tiles grouped by part of speech or theme. Every session runs in one centred "practice sheet" stage. */
:root {
  --paper: #f5f6f3; --sheet: #ffffff; --ink: #1d2220; --muted: #5d6762; --faint: #c9cfcb;
  --guide: #9cc3ad; --guide-soft: #e6f1ea; --hanko: #c43d2b; --hanko-soft: #fbe9e6;
  --ok: #2f7d55; --ok-soft: #e3f3ea; --bad: #b8432f; --bad-soft: #f8e6e2; --gold: #b9842a;
  --kanji: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141816; --sheet: #1c211f; --ink: #e9ece9; --muted: #9aa49f; --faint: #3a423e;
    --guide: #3f6a54; --guide-soft: #1e2b24; --hanko: #e2614c; --hanko-soft: #3a211d;
    --ok: #6cc596; --ok-soft: #1b3326; --bad: #ec8a76; --bad-soft: #3a221d; --gold: #ddb062; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141816; --sheet: #1c211f; --ink: #e9ece9; --muted: #9aa49f; --faint: #3a423e;
  --guide: #3f6a54; --guide-soft: #1e2b24; --hanko: #e2614c; --hanko-soft: #3a211d;
  --ok: #6cc596; --ok-soft: #1b3326; --bad: #ec8a76; --bad-soft: #3a221d; --gold: #ddb062; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.6; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--guide); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 0 56px; }
.jp { font-family: var(--kanji); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--faint); }
.bar-in { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--kanji); font-weight: 600; font-size: 1.25rem; margin-right: auto; display: flex; align-items: baseline; gap: 8px; cursor: pointer; background: none; border: 0; padding: 0; }
.brand small { font-family: var(--ui); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill svg { width: 14px; height: 14px; }
.pill.streak { color: var(--hanko); }
.icon-btn { border: 1px solid var(--faint); background: var(--sheet); border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }

.hero { padding-block: 26px 6px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; }
.hero h1 { font-family: var(--kanji); font-weight: 600; font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.15; }
.hero p { margin: 6px 0 0; color: var(--muted); max-width: 52ch; }
.tally { display: grid; justify-items: end; gap: 4px; }
.tally .big { font-family: var(--kanji); font-weight: 600; font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tally .big span { font-size: 1rem; color: var(--muted); }
.tally .lbl { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.levelbar { margin-top: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.levelbar .track { height: 8px; border-radius: 999px; background: var(--guide-soft); overflow: hidden; }
.levelbar .fill { height: 100%; background: var(--guide); border-radius: 999px; transition: width .6s ease; }
.levelbar b { color: var(--ink); }

.today { margin-top: 18px; background: var(--sheet); border: 1px solid var(--faint); border-radius: 16px; padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.today h2 { font-size: 1.15rem; }
.today p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.cta { border: 0; border-radius: 12px; background: var(--ink); color: var(--paper); font-weight: 700; padding: 12px 20px; cursor: pointer; font-size: 1rem; white-space: nowrap; }
.cta:disabled { opacity: .4; cursor: default; }
.ghost { border: 1px solid var(--faint); background: var(--sheet); border-radius: 12px; padding: 10px 16px; font-weight: 700; cursor: pointer; }

.section-h { margin-top: 30px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-h h2 { font-size: 1.05rem; letter-spacing: .02em; }
.section-h .hint { font-size: .82rem; color: var(--muted); }
.games { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.game { text-align: left; background: var(--sheet); border: 1px solid var(--faint); border-radius: 14px; padding: 14px; cursor: pointer; display: grid; gap: 4px; align-content: start; transition: transform .15s ease, border-color .15s ease; }
.game:hover { transform: translateY(-2px); border-color: var(--guide); }
.game[disabled] { opacity: .5; cursor: default; transform: none; }
.game .gk { font-family: var(--kanji); font-size: 1.4rem; line-height: 1.15; }
.game b { font-size: .98rem; }
.game span { font-size: .82rem; color: var(--muted); }
.game .best { color: var(--gold); font-weight: 700; }
.super { margin-top: 12px; width: 100%; text-align: left; background: var(--ink); color: var(--paper); border: 0; border-radius: 16px; padding: 16px 18px; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.super .gk { font-family: var(--kanji); font-weight: 600; font-size: 2rem; line-height: 1; background: var(--hanko); color: #fff; border-radius: 8px; width: 52px; height: 52px; display: grid; place-items: center; }
.super b { display: block; font-size: 1.05rem; }
.super span { font-size: .84rem; opacity: .8; }
.super .go { font-weight: 700; white-space: nowrap; opacity: 1; }
.super .track { height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 25%, transparent); overflow: hidden; margin-top: 8px; }
.super .track i { display: block; height: 100%; background: var(--hanko); }
.runstats { font-size: .85rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }

.chips { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--faint); background: var(--sheet); border-radius: 999px; padding: 4px 12px; font-size: .82rem; cursor: pointer; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.group { margin-top: 18px; }
.group-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: .8rem; color: var(--muted); font-weight: 700; letter-spacing: .06em; margin-bottom: 6px; }
.group-h > span:last-child { white-space: nowrap; }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.tile { position: relative; min-height: 52px; border: 1px solid var(--guide); background: var(--sheet); border-radius: 6px; cursor: pointer; display: grid; place-items: center; padding: 6px 8px; text-align: center; }
.tile .k { font-family: var(--kanji); font-size: 1.05rem; line-height: 1.25; font-weight: 600; color: color-mix(in srgb, var(--ink) 30%, var(--faint)); overflow-wrap: anywhere; }
.tile.long .k { font-size: .85rem; }
.tile.s1 .k { color: color-mix(in srgb, var(--ink) 50%, var(--faint)); }
.tile.s2 .k { color: color-mix(in srgb, var(--ink) 68%, var(--faint)); }
.tile.s3 .k { color: color-mix(in srgb, var(--ink) 85%, var(--faint)); }
.tile.s4 .k, .tile.s5 .k, .tile.s6 .k { color: var(--ink); }
.tile .stamp { position: absolute; right: 3px; bottom: 3px; width: 14px; height: 14px; }
.tile .due { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.more { margin-top: 6px; }
.legend { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 14px; font-size: .78rem; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.stage { padding-block: 18px 30px; display: grid; gap: 16px; justify-items: center; }
.stage-top { width: 100%; max-width: 560px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.progress { height: 8px; border-radius: 999px; background: var(--guide-soft); overflow: hidden; }
.progress .fill { height: 100%; background: var(--guide); transition: width .3s ease; }
.progress.timer .fill { background: var(--gold); transition: width 1s linear; }
.counter { font-size: .85rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.combo { font-size: .85rem; font-weight: 700; color: var(--hanko); min-height: 1.4em; font-variant-numeric: tabular-nums; }
.sheetq { position: relative; width: min(90vw, 440px); min-height: 170px; background: var(--sheet); border: 2px solid var(--guide); border-radius: 8px; display: grid; place-items: center; align-content: center; gap: 4px; padding: 26px 18px; text-align: center; }
.sheetq::after { content: ""; position: absolute; left: 6%; right: 6%; top: 50%; border-top: 2px dashed var(--guide-soft); }
.sheetq > * { position: relative; z-index: 1; }
.sheetq .w { font-family: var(--kanji); font-weight: 600; font-size: clamp(2.2rem, 11vw, 3.4rem); line-height: 1.2; overflow-wrap: anywhere; }
.sheetq .w.l1 { font-size: clamp(1.8rem, 8.5vw, 2.6rem); }
.sheetq .w.l2 { font-size: clamp(1.3rem, 6vw, 1.9rem); }
.sheetq .en { font-size: 1.45rem; font-weight: 700; line-height: 1.35; }
.sheetq .rd { font-family: var(--kanji); font-size: 1.1rem; color: var(--muted); }
.sheetq .speak { position: absolute; top: 8px; right: 8px; z-index: 2; }
.sheetq .tag { font-size: .78rem; color: var(--muted); }
.q-label { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; text-align: center; }
.options { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { border: 1px solid var(--faint); background: var(--sheet); border-radius: 12px; padding: 14px 12px 12px; cursor: pointer; text-align: center; font-weight: 600; min-height: 64px; display: grid; place-items: center; transition: transform .1s ease; position: relative; line-height: 1.3; overflow-wrap: anywhere; }
.opt:active { transform: scale(.98); }
.opt .n { position: absolute; top: 5px; left: 9px; font-size: .7rem; color: var(--muted); font-weight: 700; }
.opt.jp { font-size: 1.3rem; }
.opt.jp.l1 { font-size: 1.05rem; }
.opt.jp.l2 { font-size: .9rem; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); animation: shake .3s; }
.opt[disabled] { cursor: default; }
.feedback { min-height: 1.6em; font-weight: 700; text-align: center; max-width: 560px; }
.feedback.ok { color: var(--ok); }
.feedback.no { color: var(--bad); }
.nextrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.back { width: 100%; max-width: 560px; background: var(--sheet); border: 1px solid var(--faint); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; }
.rrow { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 10px; align-items: baseline; }
.rrow .lab { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.reading { font-family: var(--kanji); font-size: 1.25rem; }
.meaning { font-size: 1.1rem; font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: .78rem; border: 1px solid var(--faint); border-radius: 999px; padding: 1px 10px; }
.from { font-size: .75rem; color: var(--muted); }
.grades { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grade { border-radius: 12px; padding: 12px 8px; cursor: pointer; font-weight: 700; border: 1px solid var(--faint); background: var(--sheet); display: grid; gap: 2px; }
.grade small { font-weight: 500; font-size: .74rem; color: var(--muted); }
.grade.again { border-color: var(--bad); color: var(--bad); }
.grade.good { border-color: var(--ok); color: var(--ok); }
.grade.easy { border-color: var(--guide); }

.pairs { width: 100%; max-width: 620px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .pairs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.pcard { min-height: 86px; border: 1px solid var(--faint); background: var(--sheet); border-radius: 12px; cursor: pointer; padding: 8px; display: grid; place-items: center; text-align: center; font-weight: 600; font-size: .88rem; line-height: 1.3; overflow-wrap: anywhere; transition: transform .12s ease, opacity .35s ease; }
.pcard.jp { font-family: var(--kanji); font-size: 1.2rem; }
.pcard.jp.l1 { font-size: 1rem; }
.pcard.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink) inset; }
.pcard.miss { border-color: var(--bad); background: var(--bad-soft); animation: shake .3s; }
.pcard.done { border-color: var(--ok); background: var(--ok-soft); opacity: .35; cursor: default; }

.summary { width: 100%; max-width: 560px; background: var(--sheet); border: 1px solid var(--faint); border-radius: 16px; padding: 22px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.summary h2 { font-family: var(--kanji); font-size: 1.8rem; font-weight: 600; }
.stats3 { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats3 div { background: var(--paper); border-radius: 10px; padding: 10px 6px; }
.stats3 b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stats3 span { font-size: .74rem; color: var(--muted); }
.missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.missed button { font-family: var(--kanji); font-size: 1.05rem; padding: 4px 12px; border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 8px; cursor: pointer; }

.overlay { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: end center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 640px) { .overlay { place-items: center; } }
.sheet { width: 100%; max-width: 520px; max-height: 86vh; overflow: auto; background: var(--sheet); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.sheet-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-h h2 { font-size: 1.1rem; }
.detail-w { font-family: var(--kanji); font-weight: 600; font-size: 2.4rem; line-height: 1.2; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv div { background: var(--paper); border-radius: 10px; padding: 8px; text-align: center; }
.kv b { display: block; font-variant-numeric: tabular-nums; }
.kv span { font-size: .72rem; color: var(--muted); }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--faint); }
.setrow:last-child { border-bottom: 0; }
.switch { position: relative; width: 46px; height: 26px; border-radius: 999px; border: 0; background: var(--faint); cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--sheet); transition: transform .2s ease; }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.seg { display: inline-flex; border: 1px solid var(--faint); border-radius: 10px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; padding: 5px 11px; cursor: pointer; font-size: .85rem; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.danger { color: var(--bad); border-color: var(--bad); }
footer { margin-top: 36px; font-size: .78rem; color: var(--muted); display: grid; gap: 4px; }

.fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; display: grid; place-items: center; }
.hanamaru { width: min(60vw, 240px); }
.hanamaru path { fill: none; stroke: var(--hanko); stroke-width: 5; stroke-linecap: round; }
.xpfloat { position: fixed; z-index: 61; pointer-events: none; font-weight: 800; color: var(--gold); font-size: 1.1rem; }
.bigstamp { width: 150px; height: 150px; }
@media (prefers-reduced-motion: no-preference) {
  .hanamaru path { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1s ease forwards; }
  .xpfloat { animation: floatup 1s ease forwards; }
  .bigstamp { animation: stamp .55s cubic-bezier(.2, 1.6, .4, 1) both; }
  .fx.fade { animation: fadeout .5s ease .9s forwards; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-40px); } }
@keyframes stamp { 0% { transform: scale(2.4) rotate(-14deg); opacity: 0; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (max-width: 520px) {
  .hero { grid-template-columns: 1fr; }
  .tally { justify-items: start; }
  .today { grid-template-columns: 1fr; }
  .board { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 5px; }
}
@media (max-width: 430px) {
  .brand small { display: none; }
  .bar-in { gap: 8px; flex-wrap: nowrap; }
}
</style>

<style>
/* Keiyōshi additions: the sentence "answer sheet" (ruled lines, a hanko-red blank), the forms table and form tiles. */
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }

.ssheet { position: relative; width: min(100%, 560px); background: var(--sheet); border: 2px solid var(--guide); border-radius: 8px; padding: 22px 18px 18px; display: grid; gap: 10px;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(2.3em - 1px), var(--guide-soft) calc(2.3em - 1px), var(--guide-soft) 2.3em); background-position: 0 14px; }
.ssheet .speak { position: absolute; top: 8px; right: 8px; }
.sent { font-family: var(--kanji); font-size: clamp(1.15rem, 4.6vw, 1.45rem); line-height: 2.3em; font-weight: 600; padding-right: 30px; }
.sent .line { display: block; }
.sent .who { font-family: var(--ui); font-size: .78em; font-weight: 700; color: var(--muted); margin-right: .3em; }
.blank { display: inline-block; min-width: 4.2em; border-bottom: 3px solid var(--hanko); text-align: center; line-height: 1.3; margin: 0 .15em; }
.blank.filled { color: var(--ok); border-bottom-color: var(--ok); padding: 0 .2em; }
.blank.filled.miss { color: var(--bad); border-bottom-color: var(--bad); }
mark.cue { background: var(--hanko-soft); color: inherit; border-radius: 4px; padding: 0 .12em; box-shadow: inset 0 -2px 0 var(--hanko); }
.ssheet .en { font-size: .95rem; color: var(--muted); line-height: 1.4; }
.rule { width: 100%; max-width: 560px; font-size: .92rem; line-height: 1.5; background: var(--sheet); border: 1px solid var(--faint); border-left: 4px solid var(--hanko); border-radius: 10px; padding: 10px 14px; }
.rule b { font-family: inherit; }
.formchip { display: inline-flex; gap: 6px; align-items: baseline; font-size: .9rem; font-weight: 700; background: var(--hanko-soft); color: var(--hanko); border-radius: 999px; padding: 3px 12px; }
.formchip small { font-weight: 500; color: var(--muted); }
.typetag { font-size: .78rem; font-weight: 700; border: 1px solid var(--faint); border-radius: 999px; padding: 1px 10px; color: var(--muted); }
.opt.jp { font-family: var(--kanji); }

.ftable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ftable th { text-align: left; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 6px 6px 4px 0; }
.ftable th { width: 50%; }
.ftable td { padding: 0 4px 4px 0; vertical-align: middle; }
.ftable tr.lab td { border-top: 1px solid var(--faint); padding: 6px 0 0; font-size: .74rem; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.ftable button { font-family: var(--kanji); font-size: clamp(.8rem, 3.5vw, 1rem); border: 0; background: none; padding: 2px 0; border-radius: 6px; cursor: pointer; text-align: left; white-space: nowrap; }
.ftable button:hover { background: var(--guide-soft); }
.ftable tr.hl td { background: var(--hanko-soft); }
.ftable tr.lab.hl td { color: var(--hanko); }

.tbl-wrap { width: 100%; max-width: 560px; overflow-x: auto; }
.note { font-size: .88rem; background: var(--hanko-soft); border-radius: 10px; padding: 8px 12px; }

.forms { margin-top: 12px; display: grid; gap: 14px; }
.fgroup-h { font-size: .8rem; color: var(--muted); font-weight: 700; letter-spacing: .06em; margin-bottom: 6px; }
.frow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 520px) { .frow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ftile { text-align: left; border: 1px solid var(--faint); background: var(--sheet); border-radius: 10px; padding: 8px 10px; cursor: pointer; display: grid; gap: 3px; }
.ftile[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink) inset; }
.ftile b { font-size: .84rem; line-height: 1.25; }
.ftile .ex { font-family: var(--kanji); font-size: .95rem; color: var(--muted); }
.ftile .acc { display: flex; justify-content: space-between; font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.ftile .track { height: 5px; border-radius: 999px; background: var(--guide-soft); overflow: hidden; }
.ftile .track i { display: block; height: 100%; background: var(--guide); }
.ftile .track i.low { background: var(--gold); }
.focusbar { margin-top: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--hanko-soft); border-radius: 12px; padding: 8px 12px; font-size: .9rem; }
.tile .tt { position: absolute; left: 4px; top: 2px; font-size: .62rem; font-weight: 700; color: var(--muted); }
.tile .trap { position: absolute; left: 4px; bottom: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--hanko); }

@media (max-width: 520px) { .games { grid-template-columns: repeat(2, minmax(0, 1fr)); } .games .game:last-child:nth-child(odd) { grid-column: 1 / -1; } }
.sortbtns { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sortbtns .opt { min-height: 84px; font-size: 1.15rem; }
.sortbtns .opt big { display: block; font-family: var(--kanji); font-size: 1.9rem; line-height: 1.1; }
</style>

const $ = (s, r = document) => r.querySelector(s);

const rnd = a => a[Math.floor(Math.random() * a.length)];
const dayStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

const MIN = 60e3, DAY = 864e5;

const STAGE_NAME = ["New", "Learning", "Learning", "Getting there", "合格 · Mastered", "合格 · Mastered", "合格 · Mastered"];
const card = k => S.cards[k] || { s: 0, due: 0, r: 0, w: 0 };
const stage = k => card(k).s;

const inGroup = a => group === "all" || (group === "trap" ? !!a.note : a.type === group);
const pool = () => W.filter(inGroup);

function streak() {

}

let actx = null;

}

/* ---------------- spaced repetition (one card per adjective) ---------------- */
function grade(k, g) {            // g: 0 again, 1 good, 2 easy
  const c = Object.assign({ s: 0, due: 0, r: 0, w: 0 }, S.cards[k]);
  const before = c.s;
  if (g === 0) { c.s = Math.max(1, c.s - 2); c.w++; } else { c.s = Math.min(6, c.s + (g === 2 ? 2 : 1)); c.r++; }
  c.due = now() + (g === 0 ? MIN : INTERVAL[c.s]);
  S.cards[k] = c;
  return before < 4 && c.s >= 4;
}
function quizResult(k, ok) {
  const c = Object.assign({ s: 0, due: 0, r: 0, w: 0 }, S.cards[k]);
  if (ok) c.r++; else { c.w++; if (c.s > 0) { c.s = Math.max(1, c.s - 1); c.due = now(); } }
  S.cards[k] = c;
}
function sessionQueue() {
  const due = pool().filter(a => isDue(a.w)).sort((a, b) => card(a.w).due - card(b.w).due).map(a => a.w);
  const nw = pool().filter(a => stage(a.w) === 0).map(a => a.w).slice(0, newLeft());
  return { due: due.slice(0, 30), fresh: nw };
}
// which form a flashcard asks for: rotates through the forms the word has, weakest first when focusing
function cardForm(a) {
  if (focus && a.d.includes(focus)) return focus;
  const fs = ORDER.filter(f => a.d.includes(f)); const c = card(a.w);
  return fs[(c.r + c.w) % fs.length];
}

/* ---------------- questions ---------------- */
// q = { kind: "sent" | "pick" | "listen", a, f, sent?, options: [{ text, ok, trap }] }
function withTrap(right, wrong, trap) {
  let w = shuffle(wrong);
  if (trap && Math.random() < .6) w[0] = trap;
  return shuffle([{ text: right, ok: true }, ...w.map(t => ({ text: t, ok: false, trap: t === trap }))]);
}
function sentQ(s, kind = "sent") { const a = BY[s.a]; return { kind, a, f: s.f, sent: s, options: withTrap(s.o[0], s.o.slice(1), s.t) }; }

// candidate sentences / forms after the group and form filters (falls back to everything if too few)
function sentPool(listenOnly) {
  let xs = SENT.filter(s => inGroup(BY[s.a]) && (!focus || s.f === focus) && (!listenOnly || TENSE.includes(s.f)));
  if (xs.length < 4 && !focus) xs = SENT.filter(s => !listenOnly || TENSE.includes(s.f));
  return xs;
}
function pickPool() {
  const out = [];
  pool().forEach(a => a.d.forEach(f => { if (!focus || f === focus) out.push([a, f]); }));
  return out.length ? out : W.flatMap(a => a.d.map(f => [a, f]));
}
// prefer adjectives you've met; then top up with form-pick questions when sentences run short
function buildQs(kind, n) {
  const qs = [];
  if (kind === "pick") { pick(pickPool(), n).forEach(([a, f]) => qs.push(pickQ(a, f))); return qs; }
  const sp = sentPool(kind === "listen");
  const met = sp.filter(s => stage(s.a) > 0);
  const src = met.length >= n ? met : sp;
  pick(src, n).forEach(s => qs.push(sentQ(s, kind)));
  if (qs.length < n && kind === "sent") pick(pickPool(), n - qs.length).forEach(([a, f]) => qs.push(pickQ(a, f)));
  return qs;
}

function sentHtml(s, filled, missed) {

const backupName = () => `n5-adjectives-progress-${dayStr()}.json`;

function restoreProgress(file, close) {

  const note = $("#restore-note"), r = new FileReader();

}

function answerFlash(g, btn) {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const cur = current, item = cur.queue.shift();
  if (item.isNew && !item.counted) { useNew(); item.counted = true; }

function startQuiz(type, given) {

    timers.push(setTimeout(nextSort, a.note ? 1800 : 900));
  } else {
    btn.classList.add("wrong"); g.combo = 0; g.missed.add(a.w); sfx.no(); $("#combo").textContent = "";
    $("#q-fb").className = "feedback no"; $("#q-fb").textContent = `${a.w} is a ${typeName(a)}`;
    $("#q-next").innerHTML = `<button class="cta" id="q-go">Next</button>`;
    $("#q-go").addEventListener("click", nextSort); $("#q-go").focus();
  }
  save();
}
function nextSort() { stopTimers(); current.i++; showSort(); }

/* ---------------- super mode: every sentence, once, shuffled; resumable ---------------- */
// S.run = { order: [sentence index…], i, right, wrong: [index…], lap: 1 (all) | 2+ (missed only) }
function superCard() {
  const r = S.run, best = S.best.super;
  const sub = r ? `${r.lap > 1 ? "Missed sentences · " : ""}${r.i} of ${r.order.length} done · ${r.right} right so far`
    : `All ${SENT.length} sentences, shuffled, in one long quiz. Every adjective, every ending. Stop anytime; it picks up where you left off.${best ? ` <span style="color:var(--gold);opacity:1">Best ${best}%</span>` : ""}`;
  return `<button class="super" id="super"><span class="gk">全</span>
    <span><b>Super mode</b><span>${sub}</span>${r ? `<div class="track"><i style="width:${r.i / r.order.length * 100}%"></i></div>` : ""}</span>
    <span class="go">${r ? "Resume →" : "Start →"}</span></button>`;
}
function newRun(idx, lap) { S.run = { order: shuffle(idx), i: 0, right: 0, wrong: [], lap }; save(); }
function startSuper() {
  if (!S.run) newRun(SENT.map((_, i) => i), 1);
  current = { kind: "super", xp: 0, combo: 0, best: 0 };
  stopTimers();
  stageShell(qShell(`<div class="runstats" id="run-stats"></div>`));
  $("#quit").textContent = "Pause";
  showSuper();
}
function showSuper() {
  const g = current, r = S.run;
  if (r.i >= r.order.length) return finishSuper();
  const s = SENT[r.order[r.i]];
  if (!s || !BY[s.a]) { r.i++; return showSuper(); }
  const listen = canSpeak() && S.settings.listenQs && TENSE.includes(s.f) && Math.random() < 1 / 6;
  g.q = sentQ(s, listen ? "listen" : "sent");
  setProg(r.i / r.order.length, `${r.i + 1}/${r.order.length}`);
  const done = r.i, acc = done ? Math.round(100 * r.right / done) : 0;
  $("#run-stats").textContent = `${r.lap > 1 ? "Missed sentences · " : ""}${r.right} right · ${r.wrong.length} missed${done ? ` · ${acc}%` : ""}`;
  mountQ(g.q);
  $("#q-fb").textContent = ""; $("#q-fb").className = "feedback"; $("#q-next").innerHTML = "";
  if (g.q.kind === "listen") {
    $("#q-next").innerHTML = `<button class="ghost" id="skip-listen">Can't listen now</button><button class="ghost" id="no-listen">Turn off listening questions</button>`;
    const swap = () => { stopTimers(); g.q = sentQ(s, "sent"); mountQ(g.q); $("#q-next").innerHTML = ""; bindSuperOptions(); };
    $("#skip-listen").addEventListener("click", swap);
    $("#no-listen").addEventListener("click", () => { S.settings.listenQs = false; save(); toast("Listening questions off · turn back on in Settings"); swap(); });
  }
  bindSuperOptions();
}
function bindSuperOptions() {
  const g = current;
  g.answered = false;
  document.querySelectorAll("#q-opts .opt").forEach(b => b.addEventListener("click", () => answerSuper(+b.dataset.i)));
  document.onkeydown = e => {
    if (e.key === "s" && g.q.kind === "listen" && !g.answered && $("#skip-listen")) { $("#skip-listen").click(); return; }
    if (["1", "2", "3", "4"].includes(e.key) && !g.answered) answerSuper(+e.key - 1);
    else if ((e.key === "Enter" || e.key === " ") && g.answered) { e.preventDefault(); nextSuper(); }
  };
}
function answerSuper(i) {
  const g = current, q = g.q, r = S.run;
  if (g.answered) return; g.answered = true;
  const ok = scoreQ(q, i);
  const btns = document.querySelectorAll("#q-opts .opt");
  const idx = r.order[r.i]; r.i++;
  if (ok) {
    r.right++; g.combo++; g.best = Math.max(g.best, g.combo);
    const xp = 5 + (g.combo >= 5 ? 3 : 0); g.xp += xp; addXP(xp, btns[i]); sfx.ok();
    $("#q-fb").className = "feedback ok"; $("#q-fb").textContent = "正解!";
    $("#combo").textContent = g.combo >= 2 ? `${g.combo} in a row` : "";
    if (g.combo % 10 === 0) hanamaru();
  } else {
    r.wrong.push(idx); g.combo = 0; sfx.no(); $("#combo").textContent = "";
    $("#q-fb").className = "feedback no"; $("#q-fb").textContent = `Answer: ${q.options.find(o => o.ok).text}`;
  }
  $("#q-next").innerHTML = `<button class="cta" id="q-go">Next <span style="opacity:.6;font-weight:500">· enter</span></button>`;
  $("#q-go").addEventListener("click", nextSuper); if (!ok) $("#q-go").focus();
  save();
}
function nextSuper() { stopTimers(); showSuper(); }
function finishSuper() {
  const r = S.run; stopTimers();
  const acc = Math.round(100 * r.right / r.order.length);
  let isBest = false;
  if (r.lap === 1 && acc > (S.best.super || 0)) { S.best.super = acc; isBest = true; }
  const missed = r.wrong.slice();
  const missedAdj = [...new Set(missed.map(i => SENT[i] && SENT[i].a).filter(Boolean))];
  S.run = null; markToday(); save();
  sfx.done(); if (!missed.length) setTimeout(hanamaru, 200);
  const title = !missed.length ? (r.lap === 1 ? "全部正解! Every sentence" : "全部できた!") : r.lap === 1 ? "Super mode complete" : "Round done";
  $("#view").innerHTML = `<section class="stage"><div class="summary"><h2>${title}</h2>
    <div class="stats3"><div><b>${r.right}/${r.order.length}</b><span>${r.lap === 1 ? "sentences right" : "missed ones now right"}</span></div><div><b>${acc}%</b><span>${isBest ? "new best" : "accuracy"}</span></div><div><b>${missed.length}</b><span>still missed</span></div></div>
    ${missedAdj.length ? `<div><div class="q-label" style="margin-bottom:6px">Adjectives to review</div><div class="missed">${missedAdj.map(k => `<button data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div></div>` : ""}
    <div class="nextrow">${missed.length ? `<button class="cta" id="retry">Redo the ${missed.length} missed</button>` : ""}<button class="${missed.length ? "ghost" : "cta"}" id="again">Start over</button><button class="ghost" id="home">Home</button></div></div></section>`;
  current = null;
  if ($("#retry")) $("#retry").addEventListener("click", () => { newRun(missed, r.lap + 1); startSuper(); });
  $("#again").addEventListener("click", () => { newRun(SENT.map((_, i) => i), 1); startSuper(); });
  $("#home").addEventListener("click", render);
  document.querySelectorAll(".missed button").forEach(b => b.addEventListener("click", () => openDetail(b.dataset.k)));
  renderBar();
}

/* ---------------- speed round ---------------- */
function startSpeed() {
  current = { kind: "speed", right: 0, total: 0, combo: 0, best: 0, score: 0, xp: 0, missed: new Set(), end: now() + 60e3 };
  stopTimers();
  stageShell(qShell());
  $("#prog").classList.add("timer");
  const tick = () => { const left = Math.max(0, current.end - now()); setProg(left / 60e3, `${Math.ceil(left / 1000)}s · ${current.score} pts`); if (left <= 0) { stopTimers(); endSession(); } };
  timers.push(setInterval(tick, 250)); tick();
  nextSpeed();
}
function nextSpeed() {
  const g = current;
  g.q = Math.random() < .7 ? buildQs("pick", 1)[0] : buildQs("sent", 1)[0];
  mountQ(g.q); g.answered = false;
  $("#q-fb").textContent = "";
  document.querySelectorAll("#q-opts .opt").forEach(b => b.addEventListener("click", () => answerSpeed(+b.dataset.i)));
  document.onkeydown = e => { if (["1", "2", "3", "4"].includes(e.key)) answerSpeed(+e.key - 1); };
}
function answerSpeed(i) {
  const g = current; if (g.answered || now() > g.end) return;
  g.answered = true; g.total++;
  const q = g.q, right = q.options.findIndex(o => o.ok), ok = i === right;
  const btns = document.querySelectorAll("#q-opts .opt");
  btns[right].classList.add("right"); quizResult(q.a.w, ok); formResult(q.f, ok);
  if (ok) {
    g.right++; g.combo++; g.best = Math.max(g.best, g.combo);
    const mult = Math.min(4, 1 + Math.floor(g.combo / 3)); g.score += 10 * mult;
    $("#combo").textContent = g.combo >= 3 ? `${g.combo} combo · ×${mult}` : "";
    sfx.ok(); if (g.combo % 10 === 0) hanamaru();
    timers.push(setTimeout(nextSpeed, 250));
  } else {
    btns[i].classList.add("wrong"); g.combo = 0; g.missed.add(q.a.w); sfx.no(); $("#combo").textContent = "";
    $("#q-fb").className = "feedback no"; $("#q-fb").textContent = `${q.a.w} · ${flabel(q.f)} → ${q.options[right].text}`;
    timers.push(setTimeout(nextSpeed, 1600));
  }
}

/* ---------------- end of a session ---------------- */
function endSession() {
  const g = current; stopTimers();
  let title, s1, s2, s3, extra = "";
  if (g.kind === "flash") {
    title = g.mastered.length ? "合格!" : "お疲れさま!";
    s1 = [g.right, "cards done"]; s2 = [g.missed.size, "needed another look"]; s3 = [g.xp, "XP"];
    if (g.mastered.length) extra = `<p>Newly mastered: <b style="font-family:var(--kanji);font-size:1.15rem">${g.mastered.map(esc).join("、")}</b></p>`;
  } else if (g.kind === "quiz" || g.kind === "sort") {
    const n = g.kind === "quiz" ? g.qs.length : g.xs.length;
    if (g.kind === "sort") { const isBest = g.right > (S.best.sort || 0); if (isBest) S.best.sort = g.right; }
    title = g.right === n ? "満点! Perfect" : g.right >= n * .7 ? "よくできました" : "もう一度!";
    s1 = [`${g.right}/${n}`, "correct"]; s2 = [g.best, "best streak"]; s3 = [g.xp, "XP"];
  } else {
    const isBest = g.score > (S.best.speed || 0); if (isBest) S.best.speed = g.score;
    const xp = Math.round(g.score / 2); addXP(xp); g.xp = xp;
    title = isBest ? "New best!" : "Time!";
    s1 = [g.score, "points"]; s2 = [`${g.right}/${g.total}`, "correct"]; s3 = [g.best, "best combo"];
  }
  markToday(); save();
  if (g.kind !== "flash" || g.right) sfx.done();
  const perfect = (g.kind === "quiz" && g.right === g.qs.length) || (g.kind === "sort" && g.right === g.xs.length);
  if (perfect || (g.kind === "flash" && g.mastered.length)) setTimeout(hanamaru, 200);
  const missed = [...g.missed];
  $("#view").innerHTML = `<section class="stage"><div class="summary"><h2>${title}</h2>
    <div class="stats3"><div><b>${s1[0]}</b><span>${s1[1]}</span></div><div><b>${s2[0]}</b><span>${s2[1]}</span></div><div><b>${s3[0]}</b><span>${s3[1]}</span></div></div>
    ${extra}
    ${missed.length ? `<div><div class="q-label" style="margin-bottom:6px">Review these</div><div class="missed">${missed.map(k => `<button data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div></div>` : ""}
    <div class="nextrow"><button class="cta" id="again">Play again</button><button class="ghost" id="home">Home</button></div></div></section>`;
  current = null;
  let again = { flash: startFlash, quiz: () => startQuiz(g.type, g.given), sort: startSort, speed: startSpeed }[g.kind];
  const q = sessionQueue();
  if (g.kind === "flash" && !(q.due.length + q.fresh.length)) { $("#again").textContent = "Play Time-word sentences"; again = () => startQuiz("sent"); }
  $("#again").addEventListener("click", again);
  $("#home").addEventListener("click", render);
  document.querySelectorAll(".missed button").forEach(b => b.addEventListener("click", () => openDetail(b.dataset.k)));
  renderBar();
}

render();
</script>
