<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Counter Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one column. Top: the object card on practice paper. Below: counter "bins", each labelled with its
   kanji, reading and shape rule. Same palette family as N5 Kanji Renshū and Kazoeru. */
:root {
  --paper: #f5f6f3; --sheet: #ffffff; --ink: #1d2220; --muted: #5d6762; --faint: #c9cfcb;
  --guide: #9cc3ad; --guide-soft: #e6f1ea; --hanko: #c43d2b; --hanko-soft: #fbe9e6;
  --ok: #2f7d55; --ok-soft: #e3f3ea; --bad: #b8432f; --bad-soft: #f8e6e2; --gold: #b9842a;
  --kanji: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141816; --sheet: #1c211f; --ink: #e9ece9; --muted: #9aa49f; --faint: #3a423e;
    --guide: #3f6a54; --guide-soft: #1e2b24; --hanko: #e2614c; --hanko-soft: #3a211d;
    --ok: #6cc596; --ok-soft: #1b3326; --bad: #ec8a76; --bad-soft: #3a221d; --gold: #ddb062; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141816; --sheet: #1c211f; --ink: #e9ece9; --muted: #9aa49f; --faint: #3a423e;
  --guide: #3f6a54; --guide-soft: #1e2b24; --hanko: #e2614c; --hanko-soft: #3a211d;
  --ok: #6cc596; --ok-soft: #1b3326; --bad: #ec8a76; --bad-soft: #3a221d; --gold: #ddb062; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.55; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--guide); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: grid; gap: 16px; }
.top { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--kanji); font-weight: 600; font-size: 1.25rem; margin-right: auto; display: flex; gap: 8px; align-items: baseline; }
.brand small { font-family: var(--ui); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.ghost { border: 1px solid var(--faint); background: var(--sheet); border-radius: 12px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
.cta { border: 0; border-radius: 12px; background: var(--ink); color: var(--paper); font-weight: 700; padding: 12px 22px; cursor: pointer; font-size: 1rem; }
.cta:disabled { opacity: .35; cursor: default; }
.intro h1 { font-family: var(--kanji); font-weight: 600; font-size: clamp(1.6rem, 6vw, 2rem); line-height: 1.2; }
.intro p { margin: 6px 0 0; color: var(--muted); }

/* stages */
.stages { display: grid; gap: 10px; }
.stage { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: var(--sheet); border: 1px solid var(--faint); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
.stage[disabled] { opacity: .45; cursor: default; }
.stage .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--guide-soft); }
.stage.done .num { background: var(--hanko); color: #fff; font-family: var(--kanji); }
.stage b { display: block; }
.stage .ks { font-family: var(--kanji); font-weight: 600; font-size: 1.3rem; letter-spacing: .08em; }
.stage .meta { font-size: .8rem; color: var(--muted); }
.stage .stars { font-size: .82rem; font-weight: 700; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* learn cards */
.learn { display: grid; gap: 10px; }
.lcard { background: var(--sheet); border: 1px solid var(--faint); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; align-items: center; }
.lcard .k { font-family: var(--kanji); font-weight: 600; font-size: 2.6rem; line-height: 1; text-align: center; border: 2px solid var(--guide); border-radius: 6px; padding: 10px 0; background: var(--paper); }
.lcard .k small { display: block; font-family: var(--ui); font-size: .78rem; color: var(--muted); font-weight: 700; margin-top: 4px; }
.lcard h3 { font-size: 1.05rem; }
.lcard .ex { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.lcard .ex span { background: var(--paper); border-radius: 999px; padding: 2px 10px 2px 6px; font-size: .9rem; }
.lcard .ex i { font-style: normal; margin-right: 4px; }

/* play */
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.progress { height: 8px; border-radius: 999px; background: var(--guide-soft); overflow: hidden; }
.progress .fill { height: 100%; background: var(--guide); transition: width .3s ease; }
.counter { font-size: .85rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.object { justify-self: center; position: relative; width: min(70vw, 260px); aspect-ratio: 1.1; background: var(--sheet); border: 2px solid var(--guide); border-radius: 8px; display: grid; place-items: center; align-content: center; gap: 4px; padding: 10px; }
.object::before { content: ""; position: absolute; left: 50%; top: 6%; bottom: 6%; border-left: 2px dashed var(--guide-soft); }
.object::after { content: ""; position: absolute; top: 50%; left: 6%; right: 6%; border-top: 2px dashed var(--guide-soft); }
.object > * { position: relative; z-index: 1; }
.object .pic { font-size: clamp(3.6rem, 18vw, 4.8rem); line-height: 1.1; }
.object .w { font-family: var(--kanji); font-weight: 600; font-size: 1.8rem; line-height: 1.1; }
.object .en { font-size: .9rem; color: var(--muted); }
.ask { text-align: center; font-weight: 700; }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.bin { border: 1px solid var(--faint); background: var(--sheet); border-radius: 14px; padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; transition: transform .1s ease; }
.bin:active { transform: scale(.98); }
.bin .k { font-family: var(--kanji); font-weight: 600; font-size: 2rem; line-height: 1; min-width: 1.4em; text-align: center; }
.bin .r { font-weight: 700; font-size: .95rem; }
.bin .rule { font-size: .78rem; color: var(--muted); line-height: 1.3; }
.bin.right { background: var(--ok-soft); border-color: var(--ok); }
.bin.wrong { background: var(--bad-soft); border-color: var(--bad); animation: shake .3s; }
.bin[disabled] { cursor: default; }
.nohints .bin .rule { display: none; }
.feedback { background: var(--sheet); border: 1px solid var(--faint); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.feedback .v { font-weight: 700; }
.feedback .v.ok { color: var(--ok); }
.feedback .v.no { color: var(--bad); }
.feedback .say { font-family: var(--kanji); font-size: 1.1rem; }
.feedback .say small { font-family: var(--ui); color: var(--muted); font-size: .8rem; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); cursor: pointer; background: none; border: 0; padding: 0; }
.switch { width: 40px; height: 24px; border-radius: 999px; background: var(--faint); position: relative; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--sheet); transition: transform .2s ease; }
.toggle[aria-checked="true"] .switch { background: var(--ok); }
.toggle[aria-checked="true"] .switch::after { transform: translateX(16px); }
.summary { background: var(--sheet); border: 1px solid var(--faint); border-radius: 16px; padding: 22px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.summary h2 { font-family: var(--kanji); font-weight: 600; font-size: 2rem; }
.summary p { margin: 0; color: var(--muted); }
.missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.missed span { background: var(--bad-soft); border: 1px solid var(--bad); border-radius: 999px; padding: 2px 10px; font-size: .9rem; }
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; display: grid; place-items: center; }
.hanamaru { width: min(56vw, 220px); }
.hanamaru path { fill: none; stroke: var(--hanko); stroke-width: 5; stroke-linecap: round; }
@media (prefers-reduced-motion: no-preference) {
  .hanamaru path { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1s ease forwards; }
  .fx { animation: fadeout .5s ease .9s forwards; }
  .object.pop { animation: pop .35s ease; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes pop { 50% { transform: scale(1.05); } }
</style>

<main class="wrap" id="app"></main>

<script>
/* Counters, the shape rule that decides them, and how 2 of them are said (a gentle first look at readings). */
const COUNTERS = {
  "本": { r: "ほん", rule: "long & thin", two: "にほん" },
  "枚": { r: "まい", rule: "flat & thin", two: "にまい" },
  "冊": { r: "さつ", rule: "books & notebooks", two: "にさつ" },
  "匹": { r: "ひき", rule: "small animals", two: "にひき" },
  "人": { r: "にん", rule: "people", two: "ふたり" },
  "台": { r: "だい", rule: "machines & vehicles", two: "にだい" },
  "杯": { r: "はい", rule: "cups, glasses & bowls (of…)", two: "にはい" },
  "個": { r: "こ", rule: "small, round-ish things (or ～つ)", two: "にこ" },
  "足": { r: "そく", rule: "pairs of shoes & socks", two: "にそく" },
  "軒": { r: "けん", rule: "houses & buildings", two: "にけん" },
};
/* [picture, word, English, counter] */
const OBJECTS = [
  ["☂️", "かさ", "umbrella", "本"], ["✏️", "えんぴつ", "pencil", "本"], ["🖊️", "ペン", "pen", "本"], ["🍌", "バナナ", "banana", "本"], ["🌲", "き", "tree", "本"], ["👔", "ネクタイ", "necktie", "本"],
  ["🎫", "きっぷ", "ticket", "枚"], ["👕", "シャツ", "shirt", "枚"], ["🍽️", "さら", "plate", "枚"], ["📄", "かみ", "sheet of paper", "枚"], ["💿", "CD", "CD", "枚"], ["📸", "しゃしん", "photo", "枚"],
  ["📕", "本", "book", "冊"], ["📓", "ノート", "notebook", "冊"], ["📖", "じしょ", "dictionary", "冊"], ["📒", "ざっし", "magazine", "冊"],
  ["🐈", "ねこ", "cat", "匹"], ["🐕", "いぬ", "dog", "匹"], ["🐟", "さかな", "fish", "匹"], ["🐛", "むし", "insect", "匹"],
  ["🧑‍🎓", "がくせい", "student", "人"], ["🧒", "こども", "child", "人"], ["🧑‍🏫", "先生", "teacher", "人"], ["👩", "おんなの 人", "woman", "人"],
  ["🚗", "くるま", "car", "台"], ["🚲", "じてんしゃ", "bicycle", "台"], ["📺", "テレビ", "TV", "台"], ["💻", "パソコン", "computer", "台"], ["☎️", "でんわ", "telephone", "台"],
  ["☕", "コーヒー", "cup of coffee", "杯"], ["🍵", "おちゃ", "cup of tea", "杯"], ["🍚", "ごはん", "bowl of rice", "杯"], ["🥛", "ぎゅうにゅう", "glass of milk", "杯"],
  ["🥚", "たまご", "egg", "個"], ["🍎", "りんご", "apple", "個"], ["🍬", "あめ", "candy", "個"], ["🍊", "みかん", "mandarin orange", "個"],
  ["👟", "くつ", "pair of shoes", "足"], ["🧦", "くつした", "pair of socks", "足"],
  ["🏠", "いえ", "house", "軒"], ["🏪", "店", "shop", "軒"],
];
const STAGES = [
  { name: "Shapes", ks: ["本", "枚", "冊"] },
  { name: "Living things", ks: ["匹", "人"] },
  { name: "Machines & drinks", ks: ["台", "杯"] },
  { name: "The rest", ks: ["個", "足", "軒"] },
];
const ROUNDS = 10, PASS = 8;

const store = {
  get(k, d) { try { const v = localStorage.getItem("countersort:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("countersort:" + k, JSON.stringify(v)); } catch (e) {} },
};
const best = store.get("best", {});      // stage index -> best score
let hints = store.get("hints", true);
let game = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const unlocked = i => i === 0 || (best[i - 1] || 0) >= PASS;
const known = i => STAGES.slice(0, i + 1).flatMap(s => s.ks);

/* sound + celebration */
let actx = null;
function tone(seq) { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); let t = actx.currentTime; seq.forEach(([f, d, g = .1]) => { const o = actx.createOscillator(), v = actx.createGain(); o.frequency.value = f; v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(v); v.connect(actx.destination); o.start(t); o.stop(t + d); t += d * .7; }); } catch (e) {} }
const sfx = { ok: () => tone([[660, .08], [990, .13]]), no: () => tone([[220, .18, .08]]), done: () => tone([[523, .1], [659, .1], [784, .1], [1046, .22]]) };
function hanamaru() {
  const fx = document.createElement("div"); fx.className = "fx";
  fx.innerHTML = `<svg class="hanamaru" viewBox="0 0 200 200" aria-hidden="true"><path d="M100 52c26 0 46 20 46 46s-20 48-46 48-46-20-46-46c0-24 18-44 42-46 22-2 40 14 42 36 2 20-12 38-32 40-18 2-34-10-36-28-1-15 10-28 25-29 12-1 22 8 22 20"/><path d="M100 20c18 0 22 22 8 30M152 34c14 12 4 32-12 30M182 92c4 18-16 28-28 18M168 152c-6 16-28 12-28-4M100 182c-18 0-22-22-8-30M48 166c-14-12-4-32 12-30M18 108c-4-18 16-28 28-18M32 48c6-16 28-12 28 4"/></svg>`;
  document.body.appendChild(fx); setTimeout(() => fx.remove(), 1500);
}

/* ---------------- home: the four stages ---------------- */
function home() {
  game = null; document.onkeydown = null;
  $("#app").innerHTML = `<div class="top"><div class="brand">数え方 <small>Counter sort</small></div></div>
    <section class="intro"><h1>Which counter does it take?</h1>
      <p>Japanese counts things by their shape or kind: long things one way, flat things another. Learn a few counters, then sort objects into them. Score ${PASS} of ${ROUNDS} to open the next stage.</p></section>
    <div class="stages">${STAGES.map((s, i) => {
      const b = best[i] || 0, open = unlocked(i), done = b >= PASS;
      return `<button class="stage ${done ? "done" : ""}" data-s="${i}" ${open ? "" : "disabled"}>
        <span class="num">${done ? "合" : i + 1}</span>
        <span><b>${s.name} <span class="ks">${s.ks.join(" ")}</span></b><span class="meta">${open ? (i ? `Adds ${s.ks.length} counters to the ones before` : "Start here") : `Score ${PASS}/${ROUNDS} on stage ${i} to open`}</span></span>
        <span class="stars">${b ? `Best ${b}/${ROUNDS}` : ""}</span></button>`;
    }).join("")}
      <button class="stage" data-s="all" ${unlocked(STAGES.length - 1) && (best[STAGES.length - 1] || 0) >= PASS ? "" : "disabled"}>
        <span class="num">全</span><span><b>Everything mixed</b><span class="meta">All 10 counters, unlocked after stage 4</span></span><span class="stars">${best.all ? `Best ${best.all}/${ROUNDS}` : ""}</span></button>
    </div>`;
  document.querySelectorAll(".stage").forEach(b => b.addEventListener("click", () => learn(b.dataset.s === "all" ? "all" : +b.dataset.s)));
}

/* ---------------- learn: meet the counters first ---------------- */
function learn(si) {
  const ks = si === "all" ? STAGES.flatMap(s => s.ks) : STAGES[si].ks;
  const title = si === "all" ? "All 10 counters" : `Stage ${si + 1}: ${STAGES[si].name}`;
  $("#app").innerHTML = `<div class="top"><div class="brand">数え方 <small>Counter sort</small></div><button class="ghost" id="back">Stages</button></div>
    <section class="intro"><h1>${esc(title)}</h1><p>${si === "all" || si === 0 ? "Look at each counter's rule and examples, then start sorting." : "New counters for this stage. The ones you already know will be mixed in too."}</p></section>
    <div class="learn">${ks.map(k => { const c = COUNTERS[k]; const ex = OBJECTS.filter(o => o[3] === k).slice(0, 4);
      return `<div class="lcard"><div class="k">${k}<small>${c.r}</small></div><div><h3>${esc(c.rule)}</h3>
        <div class="ex">${ex.map(o => `<span><i>${o[0]}</i>${esc(o[1])}</span>`).join("")}</div></div></div>`; }).join("")}</div>
    <button class="cta" id="go" style="justify-self:center">Start sorting</button>`;
  $("#back").addEventListener("click", home);
  $("#go").addEventListener("click", () => start(si));
}

/* ---------------- play ---------------- */
function start(si) {
  const bins = si === "all" ? STAGES.flatMap(s => s.ks) : known(si);
  const fresh = si === "all" ? bins : STAGES[si].ks;
  // about 60% of objects come from the new counters, the rest review earlier ones
  const pickFrom = (ks, n) => shuffle(OBJECTS.filter(o => ks.includes(o[3]))).slice(0, n);
  const nNew = si === "all" || si === 0 ? ROUNDS : Math.round(ROUNDS * .6);
  let qs = pickFrom(fresh, nNew);
  while (qs.length < nNew) qs = qs.concat(pickFrom(fresh, nNew - qs.length));
  if (nNew < ROUNDS) qs = qs.concat(pickFrom(bins.filter(k => !fresh.includes(k)), ROUNDS - nNew));
  game = { si, bins, qs: shuffle(qs), i: 0, right: 0, streak: 0, missed: [] };
  ask();
}
function ask() {
  const g = game, o = g.qs[g.i];
  if (!o) return finish();
  $("#app").innerHTML = `<div class="top"><div class="brand">数え方 <small>Counter sort</small></div><button class="ghost" id="quit">Quit</button></div>
    <div class="bar"><div class="progress"><div class="fill" style="width:${g.i / ROUNDS * 100}%"></div></div><span class="counter">${g.i + 1}/${ROUNDS}</span></div>
    <div class="object pop"><div class="pic" aria-hidden="true">${o[0]}</div><div class="w">${esc(o[1])}</div><div class="en">${esc(o[2])}</div></div>
    <div class="ask">How do you count it?</div>
    <div class="bins ${hints ? "" : "nohints"}">${g.bins.map(k => `<button class="bin" data-k="${k}"><span class="k">${k}</span><span><span class="r">${COUNTERS[k].r}</span><br><span class="rule">${esc(COUNTERS[k].rule)}</span></span></button>`).join("")}</div>
    <div id="fb"></div>
    <div class="row"><button class="toggle" id="hints" role="switch" aria-checked="${hints}"><span class="switch"></span>Show the rules</button><span class="counter">${g.streak >= 2 ? `${g.streak} in a row` : ""}</span></div>`;
  $("#quit").addEventListener("click", home);
  $("#hints").addEventListener("click", () => { hints = !hints; store.set("hints", hints); $(".bins").classList.toggle("nohints", !hints); $("#hints").setAttribute("aria-checked", hints); });
  document.querySelectorAll(".bin").forEach(b => b.addEventListener("click", () => answer(b.dataset.k)));
  g.answered = false;
  document.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && g.answered) { e.preventDefault(); next(); } };
}
function answer(k) {
  const g = game, o = g.qs[g.i];
  if (g.answered) return; g.answered = true;
  const ok = k === o[3];
  document.querySelectorAll(".bin").forEach(b => { b.disabled = true; if (b.dataset.k === o[3]) b.classList.add("right"); if (b.dataset.k === k && !ok) b.classList.add("wrong"); });
  const c = COUNTERS[o[3]];
  if (ok) { g.right++; g.streak++; sfx.ok(); if (g.streak % 5 === 0) hanamaru(); }
  else { g.streak = 0; g.missed.push(o); sfx.no(); }
  $("#fb").innerHTML = `<div class="feedback">
    <div class="v ${ok ? "ok" : "no"}">${ok ? "正解!" : "Not quite."} ${esc(o[1])} → ${o[3]} (${c.r})</div>
    <div>${esc(o[2].charAt(0).toUpperCase() + o[2].slice(1))}: <b>${esc(c.rule)}</b>${!ok ? `, so it's ${o[3]}, not ${k}.` : "."}</div>
    <div class="say">${esc(o[1])}を ２${o[3]} <small>(${c.two}) · two of them</small></div>
    <button class="cta" id="next" style="justify-self:start">${g.i + 1 < ROUNDS ? "Next" : "See results"}</button></div>`;
  $("#next").addEventListener("click", next); $("#next").focus();
}
function next() { game.i++; ask(); }
function finish() {
  const g = game; document.onkeydown = null;
  const key = g.si === "all" ? "all" : g.si;
  const prev = best[key] || 0;
  if (g.right > prev) { best[key] = g.right; store.set("best", best); }
  const passed = g.right >= PASS;
  const opensNext = g.si !== "all" && passed && prev < PASS && g.si + 1 <= STAGES.length;
  sfx.done(); if (g.right === ROUNDS) setTimeout(hanamaru, 150);
  const title = g.right === ROUNDS ? "満点!" : passed ? "合格!" : "もう一度!";
  const nextLabel = g.si !== "all" && passed && g.si + 1 < STAGES.length ? `Stage ${g.si + 2}` : g.si === STAGES.length - 1 && passed ? "Everything mixed" : null;
  $("#app").innerHTML = `<div class="top"><div class="brand">数え方 <small>Counter sort</small></div></div>
    <div class="summary"><h2>${title}</h2>
      <p><b style="font-size:1.4rem;color:var(--ink)">${g.right}/${ROUNDS}</b> sorted correctly${passed ? "" : `. Get ${PASS} to open the next stage.`}</p>
      ${opensNext && nextLabel ? `<p>You opened <b>${nextLabel}</b>.</p>` : ""}
      ${g.missed.length ? `<div><p style="margin-bottom:6px">Look at these again</p><div class="missed">${g.missed.map(o => `<span>${o[0]} ${esc(o[1])} → ${o[3]}</span>`).join("")}</div></div>` : ""}
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="cta" id="again">Play again</button>
        ${nextLabel ? `<button class="ghost" id="next-stage">${nextLabel}</button>` : ""}
        <button class="ghost" id="home">Stages</button></div></div>`;
  $("#again").addEventListener("click", () => start(g.si));
  $("#home").addEventListener("click", home);
  if ($("#next-stage")) $("#next-stage").addEventListener("click", () => learn(g.si === STAGES.length - 1 ? "all" : g.si + 1));
}
home();
</script>
